<!DOCTYPE html>
<html lang="pt-BR" data-modo="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Órbita: cada publicação é uma estrela, cada assunto uma constelação." />
    <meta name="theme-color" content="#060913" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Órbita</title>
    <script>
      // Aplica o tema salvo antes do React carregar, para a tela não piscar.
      try {
        var t = localStorage.getItem('orbita-tema');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.modo = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
